# p96-renderd's settings: only what differs from mgu-render.conf (every key and its built-in default are there).
# p96-renderd runs beside the other renderers and takes nothing of theirs: its own socket, ivi ids and touch
# divert, and neither the community socket nor display-bridge's.

# --- sockets ------------------------------------------------------------------
socket_path = /run/p96-renderd/render.sock
socket_group = tm_oap_app
shared_path =
bridge_path =

# --- layer mode -----------------------------------------------------------------
# Our ivi ids: layers 0x50390000 + slot, surfaces 0x50390100 + slot ("P9"); the community renderers use 0x4d47...,
# mgu-render 0x4d52...
layer_base = 0x50390000

# --- popup watch (src/popup.h) --------------------------------------------------
# log: every surface of another program that comes up over the app area after the start is logged with its
# process, size and place (journalctl -u p96-renderd | grep popup). yield: layer apps also step back while one is
# up. Log only until the car has shown which popups are surfaces of their own (on-car).
popup_watch = log
popup_max_ms = 20000
popup_ignore =

# --- embed mode -------------------------------------------------------------------
# Off until the page template is shared with the other renderers (plan, phase 2).
embed = 0

# --- touch routing ------------------------------------------------------------------
touch_port = 30574
touch_table = p96_render

# --- front-app gating ------------------------------------------------------------------
foreground_gate = /usr/bin/node /var/opt/p96-renderd/current/foreground_gate.js
